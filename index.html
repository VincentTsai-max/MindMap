<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心智圖記事本</title>
<style>
:root{
  --paper:#f6f2e8;
  --paper-deep:#eee7d6;
  --card:#fdfaf2;
  --ink:#37332b;
  --ink-soft:#7a7160;
  --ink-faint:#a89d88;
  --line:#ddd3bf;
  --line-soft:#e9e2d1;
  --accent:#b5495b;
  --accent-deep:#963c4c;
  --accent-wash:#f6e7e7;
  --ok:#6f7d5c;
  --shadow:0 2px 16px rgba(70,58,34,.12);
  --serif:"Noto Serif TC","Source Han Serif TC","Hiragino Mincho ProN","Yu Mincho","PMingLiU",serif;
  --mono:"SFMono-Regular",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--serif);
  background:var(--paper);
  color:var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;
  font-size:15px;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font-family:inherit;color:inherit}
::selection{background:var(--accent-wash)}

/* ---------- 頂列 ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;
  height:52px;padding:0 14px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  flex:0 0 auto;z-index:30;
}
.iconbtn{
  width:34px;height:34px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
}
.iconbtn:hover{background:var(--paper-deep);color:var(--ink)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:9px;user-select:none}
.brand-seal{
  width:26px;height:26px;border-radius:5px;
  background:var(--accent);color:#fdf9f0;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;letter-spacing:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.brand-name{font-size:15px;letter-spacing:.14em;color:var(--ink)}
.map-title{
  margin-left:6px;padding:4px 10px;border-radius:7px;
  font-size:14px;color:var(--ink-soft);cursor:pointer;
  max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid transparent;
}
.map-title:hover{border-color:var(--line);color:var(--ink)}
.map-title.none{cursor:default;font-style:italic;color:var(--ink-faint)}
.map-title.none:hover{border-color:transparent}
.spacer{flex:1}
.save-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.05em}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transition:background .3s}
.save-status.dirty .dot{background:#c9a24b}
.save-status.saving .dot{background:#c9a24b;animation:pulse 1s infinite}
.save-status.saved .dot{background:var(--ok)}
.save-status.error .dot{background:var(--accent)}
@keyframes pulse{50%{opacity:.35}}
.btn{
  padding:6px 16px;border-radius:8px;font-size:13.5px;letter-spacing:.1em;
  border:1px solid var(--line);color:var(--ink);
}
.btn:hover{background:var(--paper-deep)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fdf9f0}
.btn.primary:hover{background:var(--accent-deep)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn.danger:hover{background:var(--accent-wash)}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- 主區 ---------- */
#main{flex:1;display:flex;position:relative;overflow:hidden}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(1200px 700px at 30% 0%, rgba(255,255,255,.5), transparent 70%),
  var(--paper);}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#canvas .edge{fill:none;stroke:var(--ink-faint);stroke-width:1.3;opacity:.85}
#canvas .node{cursor:pointer}
#canvas .node .box{fill:var(--card);stroke:var(--line);stroke-width:1.1;
  filter:drop-shadow(0 1px 2px rgba(70,58,34,.10))}
#canvas .node text{font-family:var(--serif);fill:var(--ink);user-select:none;pointer-events:none}
#canvas .node.root .box{fill:var(--ink);stroke:none}
#canvas .node.root text{fill:var(--paper)}
#canvas .node.sel .box{stroke:var(--accent);stroke-width:1.8}
#canvas .node.sel.root .box{stroke:var(--accent);stroke-width:1.8}
#canvas .colorbar{pointer-events:none}
#canvas .toggle circle{fill:var(--paper);stroke:var(--line);stroke-width:1.1}
#canvas .toggle:hover circle{stroke:var(--accent)}
#canvas .toggle text{font-size:10px;fill:var(--ink-soft);pointer-events:none}
#canvas .noteflag path{stroke:var(--accent);stroke-width:1.3;fill:none;stroke-linecap:round}
#canvas .noteflag rect{fill:transparent}
#canvas .noteflag:hover path{stroke:var(--accent-deep)}

.empty-hint{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;text-align:center;
  color:var(--ink-faint);letter-spacing:.12em;font-size:14px;
  pointer-events:none;padding:0 24px;line-height:2;
}
.empty-hint[hidden]{display:none}

/* 浮動工具列 */
#toolbar{
  position:absolute;left:14px;top:14px;z-index:10;
  display:flex;flex-direction:column;gap:2px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:6px 5px;box-shadow:var(--shadow);
}
#toolbar .tbtn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  width:52px;padding:7px 0 5px;border-radius:8px;color:var(--ink-soft);
}
#toolbar .tbtn:hover{background:var(--paper-deep);color:var(--ink)}
#toolbar .tbtn:disabled{opacity:.32;cursor:default}
#toolbar .tbtn:disabled:hover{background:none;color:var(--ink-soft)}
#toolbar .tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#toolbar .tbtn span{font-size:10.5px;letter-spacing:.08em}
#toolbar .sep{height:1px;background:var(--line-soft);margin:4px 6px}

/* 縮放列 */
#zoomBar{
  position:absolute;right:14px;bottom:14px;z-index:10;
  display:flex;align-items:center;gap:2px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:3px 4px;box-shadow:var(--shadow);
}
#zoomBar button{width:28px;height:28px;border-radius:6px;color:var(--ink-soft);
  display:inline-flex;align-items:center;justify-content:center;font-size:16px}
#zoomBar button:hover{background:var(--paper-deep);color:var(--ink)}
#zoomBar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
#zoomPct{min-width:46px;text-align:center;font-size:12px;color:var(--ink-soft);cursor:pointer;letter-spacing:.02em}

/* 節點行內編輯框 */
.node-editor{
  position:absolute;z-index:20;
  border:1.5px solid var(--accent);border-radius:6px;
  background:var(--card);color:var(--ink);
  padding:0 8px;box-shadow:var(--shadow);
  font-family:var(--serif);
}
.node-editor:focus{outline:none}

/* 色盤 */
.palette{
  position:absolute;z-index:25;display:flex;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;box-shadow:var(--shadow);
}
.palette .sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);position:relative}
.palette .sw:hover{transform:scale(1.12)}
.palette .sw.none{background:
  linear-gradient(135deg,transparent 44%,var(--accent) 46%,var(--accent) 54%,transparent 56%),var(--card)}

/* ---------- 筆記面板 ---------- */
#notePanel{
  flex:0 0 360px;max-width:88vw;display:flex;flex-direction:column;
  background:var(--card);border-left:1px solid var(--line);
  transition:margin-right .22s ease;z-index:15;
}
#notePanel.closed{margin-right:-360px;visibility:hidden}
@media (prefers-reduced-motion:reduce){#notePanel{transition:none}}
.np-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line-soft)}
.np-head .np-label{font-size:11.5px;color:var(--accent);letter-spacing:.22em;border:1px solid var(--accent);
  border-radius:4px;padding:1px 6px 1px 8px}
.np-node-title{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.np-tabs{display:flex;gap:2px;padding:8px 14px 0}
.np-tabs button{padding:5px 14px;font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft);
  border-bottom:2px solid transparent}
.np-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#npEdit{
  flex:1;resize:none;border:none;background:transparent;
  padding:12px 16px;font-size:14px;line-height:1.9;letter-spacing:.02em;
}
#npEdit:focus{outline:none}
#npPreview{flex:1;overflow:auto;padding:12px 16px;font-size:14px;line-height:1.9}
#npPreview h1,#npPreview h2,#npPreview h3{margin:.7em 0 .35em;letter-spacing:.06em;font-weight:600}
#npPreview h1{font-size:17px;border-bottom:1px solid var(--line-soft);padding-bottom:.25em}
#npPreview h2{font-size:15.5px}
#npPreview h3{font-size:14.5px;color:var(--ink-soft)}
#npPreview p{margin:.4em 0}
#npPreview ul,#npPreview ol{margin:.4em 0;padding-left:1.6em}
#npPreview blockquote{border-left:3px solid var(--line);color:var(--ink-soft);padding:.1em .9em;margin:.5em 0}
#npPreview code{font-family:var(--mono);font-size:12.5px;background:var(--paper-deep);border-radius:4px;padding:1px 5px}
#npPreview hr{border:none;border-top:1px solid var(--line);margin:.9em 0}
#npPreview a{color:var(--accent)}
#npPreview .md-empty{color:var(--ink-faint);letter-spacing:.1em}
.np-foot{padding:7px 16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-faint);
  display:flex;justify-content:space-between;letter-spacing:.06em}
.np-hint{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
  letter-spacing:.14em;font-size:13px;padding:20px;text-align:center;line-height:2}

/* ---------- 頁籤列 ---------- */
#tabbar{
  flex:0 0 auto;display:flex;align-items:center;gap:4px;
  min-height:42px;padding:5px 10px;
  border-top:1px solid var(--line);background:var(--paper);
  overflow-x:auto;scrollbar-width:thin;
}
#tabs{display:flex;align-items:center;gap:4px}
.tab{
  display:flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:8px 8px 0 0;
  border:1px solid var(--line);border-bottom:none;
  background:var(--paper-deep);color:var(--ink-soft);
  font-size:13px;letter-spacing:.06em;cursor:pointer;
  white-space:nowrap;user-select:none;position:relative;top:5px;
}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--card);color:var(--ink);border-color:var(--line);
  box-shadow:0 -1px 4px rgba(70,58,34,.06)}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:var(--accent);border-radius:2px}
.tab.dragging{opacity:.4}
.tab input{width:7em;border:none;background:transparent;font-size:13px;padding:0}
.tab input:focus{outline:none;border-bottom:1px solid var(--accent)}
.tab-add{
  width:30px;height:30px;border-radius:8px;color:var(--ink-soft);flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;margin-left:2px;
}
.tab-add:hover{background:var(--paper-deep);color:var(--accent)}
.tab-add svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}

/* ---------- 抽屜（筆記本清單） ---------- */
#drawer{
  position:fixed;top:0;left:0;bottom:0;width:308px;max-width:86vw;z-index:60;
  background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:transform .22s ease;box-shadow:var(--shadow);
}
#drawer.closed{transform:translateX(-104%)}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
.dw-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.dw-head h2{font-size:14.5px;letter-spacing:.2em;flex:1;font-weight:600}
#mapList{flex:1;overflow-y:auto;padding:8px}
.map-item{
  padding:10px 12px;border-radius:9px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:3px;
}
.map-item:hover{background:var(--paper-deep)}
.map-item.active{background:var(--accent-wash)}
.map-item.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--accent);border-radius:2px}
.map-item .mi-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:26px}
.map-item .mi-time{font-size:11.5px;color:var(--ink-faint);letter-spacing:.05em}
.map-item .mi-more{
  position:absolute;right:6px;top:8px;width:26px;height:26px;border-radius:6px;
  color:var(--ink-faint);display:none;align-items:center;justify-content:center;font-size:15px;
}
.map-item:hover .mi-more{display:inline-flex}
.map-item .mi-more:hover{background:var(--line-soft);color:var(--ink)}
.dw-empty{padding:30px 16px;text-align:center;color:var(--ink-faint);font-size:13px;letter-spacing:.1em;line-height:2}
.dw-foot{padding:10px 16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em}

.scrim{position:fixed;inset:0;background:rgba(55,51,43,.30);z-index:55}
.scrim.center{display:flex;align-items:center;justify-content:center;z-index:80}
.scrim[hidden]{display:none}

/* ---------- 對話框 ---------- */
.modal{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  width:min(480px,92vw);max-height:86vh;overflow-y:auto;
  padding:22px 24px;box-shadow:var(--shadow);
}
.modal h3{font-size:16px;letter-spacing:.16em;margin-bottom:14px;font-weight:600}
.modal p{font-size:14px;line-height:1.9;color:var(--ink-soft);margin-bottom:6px}
.modal label{display:block;font-size:12.5px;color:var(--ink-soft);letter-spacing:.1em;margin:12px 0 5px}
.modal input[type=text],.modal input[type=url]{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);font-size:14px;
}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal .m-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal details{margin-top:14px;border:1px solid var(--line-soft);border-radius:9px;padding:10px 14px}
.modal summary{font-size:13px;cursor:pointer;letter-spacing:.1em;color:var(--ink-soft)}
.modal ol{margin:8px 0 4px;padding-left:1.5em;font-size:13px;line-height:2;color:var(--ink-soft)}
.modal .hint{font-size:12px;color:var(--ink-faint);line-height:1.8;margin-top:8px}

/* ---------- 右鍵選單 ---------- */
.menu{
  position:fixed;z-index:90;min-width:150px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:5px;box-shadow:var(--shadow);
}
.menu button{
  display:block;width:100%;text-align:left;padding:7px 14px;border-radius:7px;
  font-size:13.5px;letter-spacing:.06em;
}
.menu button:hover{background:var(--paper-deep)}
.menu button.danger{color:var(--accent)}
.menu button.danger:hover{background:var(--accent-wash)}
.menu .msep{height:1px;background:var(--line-soft);margin:4px 8px}

/* ---------- 提示訊息 ---------- */
#toasts{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--paper);border-radius:9px;
  padding:9px 18px;font-size:13.5px;letter-spacing:.06em;
  box-shadow:var(--shadow);max-width:min(560px,88vw);
  animation:toastin .25s ease;
}
.toast.error{background:var(--accent-deep)}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:640px){
  .brand-name{display:none}
  .map-title{max-width:26vw}
  #notePanel{position:absolute;right:0;top:0;bottom:0;flex:none;width:min(360px,92vw)}
  #toolbar .tbtn{width:44px}
}
</style>
</head>
<body>

<header id="topbar">
  <button id="btnDrawer" class="iconbtn" title="筆記本清單" aria-label="筆記本清單">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="brand"><span class="brand-seal">圖</span><span class="brand-name">心智圖記事本</span></div>
  <div id="mapTitle" class="map-title none" title="重新命名筆記本">尚未開啟筆記本</div>
  <div class="spacer"></div>
  <div id="saveStatus" class="save-status"><span class="dot"></span><span id="saveStatusText">—</span></div>
  <button id="btnSave" class="btn">儲存</button>
  <button id="btnSettings" class="iconbtn" title="連線設定" aria-label="連線設定">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.7a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.7a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
  </button>
</header>

<main id="main">
  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <g id="world"><g id="edges"></g><g id="nodesG"></g></g>
    </svg>

    <div id="toolbar" hidden>
      <button class="tbtn" id="tbUndo" title="上一步（Ctrl+Z）">
        <svg viewBox="0 0 24 24"><path d="M8 5 4 9l4 4"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span>上一步</span>
      </button>
      <button class="tbtn" id="tbRedo" title="下一步（Ctrl+Y／Ctrl+Shift+Z）">
        <svg viewBox="0 0 24 24"><path d="M16 5l4 4-4 4"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        <span>下一步</span>
      </button>
      <div class="sep"></div>
      <button class="tbtn" id="tbChild" title="新增子節點（Tab）">
        <svg viewBox="0 0 24 24"><path d="M3 12h7"/><rect x="10" y="8" width="11" height="8" rx="3"/></svg>
        <span>子節點</span>
      </button>
      <button class="tbtn" id="tbSibling" title="新增同層節點（Enter）">
        <svg viewBox="0 0 24 24"><rect x="7" y="3" width="11" height="7" rx="3"/><rect x="7" y="14" width="11" height="7" rx="3"/></svg>
        <span>同層</span>
      </button>
      <button class="tbtn" id="tbDelete" title="刪除節點（Delete）">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
        <span>刪除</span>
      </button>
      <div class="sep"></div>
      <button class="tbtn" id="tbNote" title="開啟／關閉筆記面板">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg>
        <span>筆記</span>
      </button>
      <button class="tbtn" id="tbColor" title="節點顏色">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/></svg>
        <span>顏色</span>
      </button>
      <div class="sep"></div>
      <button class="tbtn" id="tbFit" title="縮放至全圖">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span>全圖</span>
      </button>
    </div>

    <div id="zoomBar" hidden>
      <button id="zOut" title="縮小" aria-label="縮小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span id="zoomPct" title="重設為 100%">100%</span>
      <button id="zIn" title="放大" aria-label="放大"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>

    <div id="emptyHint" class="empty-hint"></div>
    <input id="nodeEditor" class="node-editor" type="text" hidden>
    <div id="palettePop" class="palette" hidden></div>
  </div>

  <aside id="notePanel" class="closed">
    <div class="np-head">
      <span class="np-label">筆記</span>
      <span class="np-node-title" id="npTitle">—</span>

      <button id="npTabEdit" class="on">編輯</button>

    <textarea id="npEdit" placeholder="在此寫下這個節點的筆記……&#10;支援基本 Markdown：# 標題、**粗體**、- 清單、> 引言"></textarea>
    <div id="npPreview" hidden></div>

<footer id="tabbar">
  <div id="tabs"></div>

    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>

<aside id="drawer" class="closed">
  <div class="dw-head">
    <h2>筆記本</h2>
    <button class="iconbtn" id="btnReloadMaps" title="重新整理" aria-label="重新整理清單">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
    </button>
    <button class="iconbtn" id="btnNewMap" title="新增筆記本" aria-label="新增筆記本">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="iconbtn" id="btnDrawerClose" title="關閉" aria-label="關閉清單">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="mapList"></div>
  <div class="dw-foot">資料儲存於你的 Google 試算表</div>

<div id="modalScrim" class="scrim center" hidden><div id="modalBox" class="modal"></div></div>
<div id="ctxMenu" class="menu" hidden></div>
<div id="toasts"></div>

<script>
'use strict';
/* =====================================================
 * 心智圖記事本 — 前端（單一 HTML 檔）
 * 後端：Google Apps Script Web App（見 Code.gs）
 * ===================================================== */

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const LS_API = 'mindnote_api_url';
const LS_LAST_MAP = 'mindnote_last_map';
const LS_LAST_PAGE = 'mindnote_last_page';
const SERIF = '"Noto Serif TC","Source Han Serif TC","Hiragino Mincho ProN","Yu Mincho","PMingLiU",serif';

function uid(p){ return p + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function clamp(v,a,b){ return Math.min(b, Math.max(a, v)); }

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, type === 'error' ? 5200 : 3200);
  setTimeout(() => el.remove(), type === 'error' ? 5700 : 3700);
}

function relTime(iso){
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const d = Date.now() - t;
  if (d < 60e3) return '剛剛';
  if (d < 3600e3) return Math.floor(d/60e3) + ' 分鐘前';
  if (d < 86400e3) return Math.floor(d/3600e3) + ' 小時前';
  if (d < 7*86400e3) return Math.floor(d/86400e3) + ' 天前';
  const dt = new Date(t);
  return dt.getFullYear() + '/' + (dt.getMonth()+1) + '/' + dt.getDate();
}
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ---------- 對話框 ---------- */
const modalScrim = $('#modalScrim'), modalBox = $('#modalBox');
let modalResolve = null;

function openModal(html){
  modalBox.innerHTML = html;
  modalScrim.hidden = false;
  return modalBox;
}
function closeModal(val){
  modalScrim.hidden = true;
  modalBox.innerHTML = '';
  if (modalResolve){ const r = modalResolve; modalResolve = null; r(val); }
}
modalScrim.addEventListener('pointerdown', e => { if (e.target === modalScrim) closeModal(null); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalScrim.hidden) closeModal(null);
});

function confirmDlg(title, msg, okLabel){
  return new Promise(resolve => {
    modalResolve = resolve;
    const box = openModal(
      '<h3>' + esc(title) + '</h3>' +
      '<p>' + esc(msg) + '</p>' +
      '<div class="m-foot"><button class="btn" id="mCancel">取消</button>' +
      '<button class="btn danger" id="mOk">' + esc(okLabel || '確定') + '</button></div>');
    box.querySelector('#mCancel').onclick = () => closeModal(false);
    box.querySelector('#mOk').onclick = () => closeModal(true);
    box.querySelector('#mOk').focus();
  });
}

function promptDlg(title, value, placeholder){
  return new Promise(resolve => {
    modalResolve = resolve;
    const box = openModal(
      '<h3>' + esc(title) + '</h3>' +
      '<input type="text" id="mInput" value="' + esc(value || '') + '" placeholder="' + esc(placeholder || '') + '">' +
      '<div class="m-foot"><button class="btn" id="mCancel">取消</button>' +
      '<button class="btn primary" id="mOk">確定</button></div>');
    const input = box.querySelector('#mInput');
    input.focus(); input.select();
    const commit = () => { const v = input.value.trim(); if (!v){ input.focus(); return; } closeModal(v); };
    box.querySelector('#mCancel').onclick = () => closeModal(null);
    box.querySelector('#mOk').onclick = commit;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); });
  });
}

/* ---------- 右鍵選單 ---------- */
const ctxMenu = $('#ctxMenu');
function showMenu(x, y, items){
  ctxMenu.innerHTML = '';
  items.forEach(it => {
    if (it === '-'){ const s = document.createElement('div'); s.className = 'msep'; ctxMenu.appendChild(s); return; }
    const b = document.createElement('button');
    b.textContent = it.label;
    if (it.danger) b.className = 'danger';
    b.onclick = () => { hideMenu(); it.fn(); };
    ctxMenu.appendChild(b);
  });
  ctxMenu.hidden = false;
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = clamp(x, 6, innerWidth - r.width - 6) + 'px';
  ctxMenu.style.top = clamp(y, 6, innerHeight - r.height - 6) + 'px';
}
function hideMenu(){ ctxMenu.hidden = true; }
document.addEventListener('pointerdown', e => {
  if (!ctxMenu.hidden && !ctxMenu.contains(e.target)) hideMenu();
  if (!palettePop.hidden && !palettePop.contains(e.target) && e.target.closest('#tbColor') == null) palettePop.hidden = true;
}, true);
addEventListener('blur', hideMenu);

/* ---------- API 層 ---------- */
function apiUrl(){ return (localStorage.getItem(LS_API) || '').trim(); }
const GET_ACTIONS = ['listMaps','listPages','getPage','ping'];

async function api(action, params){
  const url = apiUrl();
  if (!url) throw new Error('尚未設定 Apps Script 部署網址');
  let res;
  try {
    if (GET_ACTIONS.includes(action)){
      const qs = new URLSearchParams(Object.assign({ action }, params || {}));
      res = await fetch(url + (url.includes('?') ? '&' : '?') + qs.toString(), { method:'GET', redirect:'follow' });
    } else {
      res = await fetch(url, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 避免 CORS 預檢
        body: JSON.stringify(Object.assign({ action }, params || {}))
      });
    }
  } catch (e){
    throw new Error('無法連線（請確認網路與部署網址）');
  }
  if (!res.ok) throw new Error('連線失敗（HTTP ' + res.status + '）');
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); }
  catch (e){ throw new Error('回應格式不正確，請確認部署網址結尾為 /exec，且存取權限為「任何人」'); }
  if (!data.ok) throw new Error(data.error || '後端回報未知錯誤');
  return data;
}

/* ---------- 狀態 ---------- */
const state = {
  maps: [],
  currentMapId: null,
  pages: [],
  currentPageId: null,
  nodes: [],            // {NodeID,ParentID,Text,Note,OrderIndex,X,Y,Color}
  selId: null,
  collapsed: new Set(), // 僅本次瀏覽有效（不入庫）
  pan: { x: 80, y: 200 },
  zoom: 1,
  dirty: false,
  saving: false,
  saveAgain: false,
  loadedOnce: false
};
let saveTimer = null;

const svg = $('#canvas'), world = $('#world'), edgesG = $('#edges'), nodesG = $('#nodesG');
const canvasWrap = $('#canvasWrap'), emptyHint = $('#emptyHint');
const nodeEditor = $('#nodeEditor'), palettePop = $('#palettePop');
const notePanel = $('#notePanel');

const mcanvas = document.createElement('canvas');
const mctx = mcanvas.getContext('2d');

function byId(id){ return state.nodes.find(n => n.NodeID === id) || null; }
function childrenOf(pid){
  return state.nodes
    .filter(n => (n.ParentID || '') === (pid || ''))
    .sort((a, b) => (a.OrderIndex - b.OrderIndex) || (a.NodeID < b.NodeID ? -1 : 1));
}
function subtreeIds(id, acc){
  acc = acc || [];
  acc.push(id);
  childrenOf(id).forEach(c => subtreeIds(c.NodeID, acc));
  return acc;
}
function isRoot(n){ return !(n.ParentID || ''); }

/* ---------- 版面量測與佈局 ---------- */
const PAD_X = 14, PAD_Y = 8, LINE_H = 21, MAX_TEXT_W = 220, H_GAP = 64, V_GAP = 16, ROOT_GAP = 90;

function wrapText(text, font){
  mctx.font = font;
  const lines = [];
  let cur = '';
  for (const ch of String(text || ' ')){
    if (ch === '\n'){ lines.push(cur); cur = ''; continue; }
    const t = cur + ch;
    if (mctx.measureText(t).width > MAX_TEXT_W && cur){ lines.push(cur); cur = ch; }
    else cur = t;
  }
  lines.push(cur);
  return lines;
}

function measureNode(n){
  const root = isRoot(n);
  const font = (root ? '600 16px ' : '400 14px ') + SERIF;
  const lines = wrapText(n.Text || '　', font);
  mctx.font = font;
  let w = 0;
  lines.forEach(l => { w = Math.max(w, mctx.measureText(l).width); });
  n._font = font; n._lines = lines;
  n._w = Math.max(root ? 110 : 56, Math.ceil(w) + PAD_X * 2 + (n.Note ? 20 : 0));
  n._h = lines.length * LINE_H + PAD_Y * 2 + (root ? 6 : 0);
}

function subtreeH(n){
  if (state.collapsed.has(n.NodeID)) return n._h;
  const ch = childrenOf(n.NodeID);
  if (!ch.length) return n._h;
  let s = 0;
  ch.forEach((c, i) => { s += subtreeH(c); if (i) s += V_GAP; });
  return Math.max(n._h, s);
}

function place(n, x, y){
  n._x = (n.X == null) ? x : n.X;
  n._y = (n.Y == null) ? y : n.Y;
  if (state.collapsed.has(n.NodeID)) return;
  const ch = childrenOf(n.NodeID);
  if (!ch.length) return;
  let total = 0;
  ch.forEach((c, i) => { total += subtreeH(c); if (i) total += V_GAP; });
  let cy = n._y + n._h / 2 - total / 2;
  for (const c of ch){
    const sh = subtreeH(c);
    place(c, n._x + n._w + H_GAP, cy + sh / 2 - c._h / 2);
    cy += sh + V_GAP;
  }
}

function layout(){
  state.nodes.forEach(measureNode);
  const roots = childrenOf('');
  let y = 0;
  roots.forEach(r => { place(r, 0, y); y += subtreeH(r) + ROOT_GAP; });
}

/* ---------- 繪製 ---------- */
function hiddenCount(id){ return subtreeIds(id).length - 1; }

function render(){
  layout();
  const eBuf = [], nBuf = [];
  const visible = new Set();
  (function walk(pid){
    childrenOf(pid).forEach(n => {
      visible.add(n.NodeID);
      if (!state.collapsed.has(n.NodeID)) walk(n.NodeID);
    });
  })('');

  for (const n of state.nodes){
    if (!visible.has(n.NodeID)) continue;
    const p = byId(n.ParentID);
    if (p && visible.has(p.NodeID)){
      const x1 = p._x + p._w, y1 = p._y + p._h / 2;
      const x2 = n._x, y2 = n._y + n._h / 2;
      const mx = (x2 - x1) / 2;
      eBuf.push('<path class="edge" d="M' + x1 + ' ' + y1 +
        ' C' + (x1 + mx) + ' ' + y1 + ',' + (x2 - mx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '"/>');
    }
  }

  for (const n of state.nodes){
    if (!visible.has(n.NodeID)) continue;
    const root = isRoot(n);
    const sel = n.NodeID === state.selId;
    const cls = 'node' + (root ? ' root' : '') + (sel ? ' sel' : '');
    let g = '<g class="' + cls + '" data-node="' + esc(n.NodeID) + '" transform="translate(' + n._x + ',' + n._y + ')">';
    const strokeAttr = (n.Color && !sel) ? ' style="stroke:' + esc(n.Color) + '"' : '';
    g += '<rect class="box" width="' + n._w + '" height="' + n._h + '" rx="7"' + strokeAttr + '/>';
    if (n.Color){
      g += '<rect class="colorbar" x="0" y="6" width="3.5" height="' + (n._h - 12) + '" rx="2" fill="' + esc(n.Color) + '"/>';
    }
    const fs = root ? 16 : 14;
    g += '<text font-size="' + fs + '"' + (root ? ' font-weight="600"' : '') + '>';
    n._lines.forEach((l, i) => {
      g += '<tspan x="' + PAD_X + '" y="' + (PAD_Y + (root ? 3 : 0) + i * LINE_H + LINE_H * 0.76) + '">' + esc(l) + '</tspan>';
    });
    g += '</text>';
    if (n.Note){
      g += '<g class="noteflag" data-role="note" transform="translate(' + (n._w - 18) + ',' + (n._h / 2 - 6) + ')">' +
           '<rect x="-3" y="-3" width="17" height="18"/>' +
           '<path d="M0 1h11M0 5h11M0 9h7"' + (root ? ' style="stroke:#e8b7bf"' : '') + '/></g>';
    }
    if (childrenOf(n.NodeID).length){
      const col = state.collapsed.has(n.NodeID);
      g += '<g class="toggle" data-role="toggle" transform="translate(' + n._w + ',' + (n._h / 2) + ')">' +
           '<circle r="8"/>' +
           '<text text-anchor="middle" y="3.4">' + (col ? hiddenCount(n.NodeID) : '−') + '</text></g>';
    }
    g += '</g>';
    nBuf.push(g);
  }

  edgesG.innerHTML = eBuf.join('');
  nodesG.innerHTML = nBuf.join('');
  applyTransform();
}

function applyTransform(){
  world.setAttribute('transform',
    'translate(' + state.pan.x + ',' + state.pan.y + ') scale(' + state.zoom + ')');
  $('#zoomPct').textContent = Math.round(state.zoom * 100) + '%';
}

let rafPending = false;
function renderSoon(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}

function fitView(){
  const vis = state.nodes.filter(n => n._x != null);
  if (!vis.length) return;
  layout();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  const visible = new Set();
  (function walk(pid){
    childrenOf(pid).forEach(n => { visible.add(n.NodeID); if (!state.collapsed.has(n.NodeID)) walk(n.NodeID); });
  })('');
  state.nodes.forEach(n => {
    if (!visible.has(n.NodeID)) return;
    x1 = Math.min(x1, n._x); y1 = Math.min(y1, n._y);
    x2 = Math.max(x2, n._x + n._w); y2 = Math.max(y2, n._y + n._h);
  });
  if (!isFinite(x1)) return;
  const r = svg.getBoundingClientRect();
  const pad = 70;
  const z = clamp(Math.min((r.width - pad * 2) / (x2 - x1), (r.height - pad * 2) / (y2 - y1)), 0.25, 1.15);
  state.zoom = z;
  state.pan.x = (r.width - (x2 - x1) * z) / 2 - x1 * z;
  state.pan.y = (r.height - (y2 - y1) * z) / 2 - y1 * z;
  applyTransform();
}

/* ---------- 歷史（上一步／下一步，作用於目前頁籤的節點） ---------- */
let hist = [], histIdx = -1, lastWasRestore = false;
const HIST_MAX = 100;

function snapNodes(){
  return state.nodes.map(n => ({
    NodeID: n.NodeID, ParentID: n.ParentID, Text: n.Text, Note: n.Note,
    OrderIndex: n.OrderIndex, X: n.X, Y: n.Y, Color: n.Color
  }));
}
function initHistory(){
  hist = [{ tag: 'init', nodes: snapNodes() }];
  histIdx = 0;
  lastWasRestore = false;
  updateUndoUI();
}
function pushHistory(tag){
  if (!state.currentPageId) return;
  hist = hist.slice(0, histIdx + 1); // 有新操作就截斷重做尾巴
  const top = hist[histIdx];
  if (tag && !lastWasRestore && top && top.tag === tag){
    top.nodes = snapNodes(); // 連續同類操作合併為一步（例如同一節點的筆記輸入）
  } else {
    hist.push({ tag: tag || '', nodes: snapNodes() });
    if (hist.length > HIST_MAX) hist.shift();
    histIdx = hist.length - 1;
  }
  lastWasRestore = false;
  updateUndoUI();
}
function restoreFrom(idx){
  const snap = hist[idx];
  if (!snap) return;
  state.nodes = snap.nodes.map(n => Object.assign({}, n));
  if (state.selId && !byId(state.selId)) state.selId = null;
  lastWasRestore = true;
  markDirty(); // 復原也是變更，會照常自動儲存
  refreshNotePanel();
  render();
  updateUndoUI();
}
function undo(){ if (histIdx > 0){ histIdx--; restoreFrom(histIdx); } }
function redo(){ if (histIdx < hist.length - 1){ histIdx++; restoreFrom(histIdx); } }
function updateUndoUI(){
  $('#tbUndo').disabled = histIdx <= 0;
  $('#tbRedo').disabled = histIdx >= hist.length - 1;
}

/* ---------- 節點操作 ---------- */
function renumberSiblings(pid){
  childrenOf(pid).forEach((c, i) => { c.OrderIndex = i + 1; });
}

function selectNode(id, opt){
  state.selId = id;
  refreshNotePanel();
  if (!(opt && opt.skipRender)) render();
}

function ensureRoot(){
  if (!childrenOf('').length){
    state.nodes.push({ NodeID: uid('n'), ParentID: '', Text: '中心主題', Note: '',
                       OrderIndex: 1, X: null, Y: null, Color: '' });
    markDirty();
  }
}

function addChild(pid){
  const parent = byId(pid || state.selId) || childrenOf('')[0];
  if (!parent){ return; }
  state.collapsed.delete(parent.NodeID);
  const n = { NodeID: uid('n'), ParentID: parent.NodeID, Text: '子主題', Note: '',
              OrderIndex: childrenOf(parent.NodeID).length + 1, X: null, Y: null, Color: '' };
  state.nodes.push(n);
  markDirty();
  pushHistory();
  selectNode(n.NodeID);
  editNode(n.NodeID, true);
}

function addSibling(){
  const sel = byId(state.selId);
  if (!sel){ return; }
  if (isRoot(sel)){ addChild(sel.NodeID); return; }
  const n = { NodeID: uid('n'), ParentID: sel.ParentID, Text: '子主題', Note: '',
              OrderIndex: sel.OrderIndex + 0.5, X: null, Y: null, Color: '' };
  state.nodes.push(n);
  renumberSiblings(sel.ParentID);
  markDirty();
  pushHistory();
  selectNode(n.NodeID);
  editNode(n.NodeID, true);
}

async function deleteNode(id){
  const n = byId(id || state.selId);
  if (!n) return;
  const ids = subtreeIds(n.NodeID);
  const hasStuff = ids.length > 1 || (n.Note && n.Note.trim());
  if (hasStuff){
    const ok = await confirmDlg('刪除節點',
      ids.length > 1
        ? '「' + (n.Text || '未命名') + '」與其 ' + (ids.length - 1) + ' 個子節點將一併刪除。'
        : '「' + (n.Text || '未命名') + '」含有筆記內容，確定刪除？', '刪除');
    if (!ok) return;
  }
  const del = new Set(ids);
  state.nodes = state.nodes.filter(x => !del.has(x.NodeID));
  ids.forEach(i => state.collapsed.delete(i));
  renumberSiblings(n.ParentID || '');
  state.selId = (n.ParentID && byId(n.ParentID)) ? n.ParentID : null;
  ensureRoot();
  markDirty();
  pushHistory();
  refreshNotePanel();
  render();
}

/* ---------- 行內編輯 ---------- */
let editingId = null;

function editNode(id, selectAll){
  const n = byId(id);
  if (!n) return;
  render();
  editingId = id;
  const left = state.pan.x + n._x * state.zoom;
  const top = state.pan.y + n._y * state.zoom;
  nodeEditor.style.left = left + 'px';
  nodeEditor.style.top = top + 'px';
  nodeEditor.style.width = Math.max(150, n._w * state.zoom + 8) + 'px';
  nodeEditor.style.height = Math.max(30, n._h * state.zoom) + 'px';
  nodeEditor.style.fontSize = (isRoot(n) ? 16 : 14) * state.zoom + 'px';
  nodeEditor.value = n.Text || '';
  nodeEditor.hidden = false;
  nodeEditor.focus();
  if (selectAll) nodeEditor.select();
}

function commitEditor(){
  if (editingId == null) return;
  const n = byId(editingId);
  editingId = null;
  nodeEditor.hidden = true;
  if (n){
    const v = nodeEditor.value.trim();
    if (v !== n.Text){ n.Text = v || '未命名'; markDirty(); pushHistory(); }
    refreshNotePanel();
  }
  render();
}
function cancelEditor(){ editingId = null; nodeEditor.hidden = true; }

nodeEditor.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter'){ e.preventDefault(); commitEditor(); }
  else if (e.key === 'Escape'){ e.preventDefault(); cancelEditor(); render(); }
  else if (e.key === 'Tab'){ e.preventDefault(); const id = editingId; commitEditor(); if (id) addChild(id); }
});
nodeEditor.addEventListener('blur', () => { if (editingId != null) commitEditor(); });

/* ---------- 畫布互動 ---------- */
const ptr = { mode: null, id: null, sx: 0, sy: 0, ox: 0, oy: 0, moved: false, role: null };

function toWorld(cx, cy){
  const r = svg.getBoundingClientRect();
  return { x: (cx - r.left - state.pan.x) / state.zoom,
           y: (cy - r.top - state.pan.y) / state.zoom };
}

svg.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  hideMenu(); palettePop.hidden = true;
  if (editingId != null) commitEditor();
  const g = e.target.closest('[data-node]');
  const roleEl = e.target.closest('[data-role]');
  ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.moved = false;
  ptr.role = roleEl ? roleEl.getAttribute('data-role') : null;
  if (g){
    ptr.mode = 'node';
    ptr.id = g.getAttribute('data-node');
    const n = byId(ptr.id);
    ptr.ox = n ? n._x : 0; ptr.oy = n ? n._y : 0;
    if (state.selId !== ptr.id) selectNode(ptr.id);
  } else {
    ptr.mode = 'pan';
    ptr.ox = state.pan.x; ptr.oy = state.pan.y;
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (!ptr.mode) return;
  const dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
  if (!ptr.moved && Math.hypot(dx, dy) < 4) return;
  ptr.moved = true;
  if (ptr.mode === 'pan'){
    state.pan.x = ptr.ox + dx;
    state.pan.y = ptr.oy + dy;
    applyTransform();
  } else if (ptr.mode === 'node' && !ptr.role){
    const n = byId(ptr.id);
    if (!n) return;
    n.X = Math.round(ptr.ox + dx / state.zoom);
    n.Y = Math.round(ptr.oy + dy / state.zoom);
    markDirty();
    renderSoon();
  }
});

svg.addEventListener('pointerup', e => {
  const mode = ptr.mode, moved = ptr.moved, role = ptr.role, id = ptr.id;
  ptr.mode = null;
  if (moved){
    if (mode === 'node' && !role) pushHistory(); // 拖曳節點完成 → 記一步
    return;
  }
  if (mode === 'node' && role === 'toggle'){
    if (state.collapsed.has(id)) state.collapsed.delete(id);
    else state.collapsed.add(id);
    render();
  } else if (mode === 'node' && role === 'note'){
    openNotePanel();
  } else if (mode === 'pan'){
    selectNode(null);
  }
});

svg.addEventListener('dblclick', e => {
  const g = e.target.closest('[data-node]');
  if (g) editNode(g.getAttribute('data-node'), true);
});

svg.addEventListener('contextmenu', e => {
  e.preventDefault();
  const g = e.target.closest('[data-node]');
  if (!g) return;
  const id = g.getAttribute('data-node');
  selectNode(id);
  showMenu(e.clientX, e.clientY, [
    { label: '新增子節點', fn: () => addChild(id) },
    { label: '新增同層節點', fn: () => addSibling() },
    { label: '編輯文字', fn: () => editNode(id, true) },
    { label: '開啟筆記', fn: () => openNotePanel() },
    '-',
    { label: '刪除節點', danger: true, fn: () => deleteNode(id) }
  ]);
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const wx = (cx - state.pan.x) / state.zoom, wy = (cy - state.pan.y) / state.zoom;
  state.zoom = clamp(state.zoom * Math.exp(-e.deltaY * 0.0016), 0.25, 2.5);
  state.pan.x = cx - wx * state.zoom;
  state.pan.y = cy - wy * state.zoom;
  applyTransform();
}, { passive: false });

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (!modalScrim.hidden) return;
  if (!state.currentPageId) return;
  if (e.key === 'Tab'){ e.preventDefault(); addChild(); }
  else if (e.key === 'Enter'){ e.preventDefault(); addSibling(); }
  else if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteNode(); }
  else if (e.key === 'F2'){ e.preventDefault(); if (state.selId) editNode(state.selId, true); }
  else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); redo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); }
  else if (e.key === 'Escape'){ closeNotePanel(); }
});

function zoomStep(f){
  const r = svg.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2;
  const wx = (cx - state.pan.x) / state.zoom, wy = (cy - state.pan.y) / state.zoom;
  state.zoom = clamp(state.zoom * f, 0.25, 2.5);
  state.pan.x = cx - wx * state.zoom;
  state.pan.y = cy - wy * state.zoom;
  applyTransform();
}

const npEdit = $('#npEdit'), npPreview = $('#npPreview'), npTitle = $('#npTitle');
const npHint = $('#npHint'), npCount = $('#npCount');
let npMode = 'edit';

function openNotePanel(){ notePanel.classList.remove('closed'); refreshNotePanel(); if (npMode === 'edit' && byId(state.selId)) npEdit.focus(); }
function closeNotePanel(){ notePanel.classList.add('closed'); }
function toggleNotePanel(){ notePanel.classList.contains('closed') ? openNotePanel() : closeNotePanel(); }
$('#npClose').onclick = closeNotePanel;
$('#npTabEdit').onclick = () => setNpMode('edit');
$('#npTabPrev').onclick = () => setNpMode('prev');
function setNpMode(m){
  npMode = m;
  $('#npTabEdit').classList.toggle('on', m === 'edit');
  $('#npTabPrev').classList.toggle('on', m === 'prev');
  refreshNotePanel();
}

function refreshNotePanel(){
  const n = byId(state.selId);
  const has = !!n;
  npTitle.textContent = has ? (n.Text || '未命名') : '—';
  npHint.hidden = has;
  npEdit.hidden = !has || npMode !== 'edit';
  npPreview.hidden = !has || npMode !== 'prev';
  if (has){
    if (npMode === 'edit'){
      if (document.activeElement !== npEdit) npEdit.value = n.Note || '';
    } else {
      npPreview.innerHTML = (n.Note && n.Note.trim()) ? mdRender(n.Note) : '<p class="md-empty">（尚無筆記）</p>';
    }
    npCount.textContent = (n.Note || '').length + ' 字';
  } else {
    npCount.textContent = '0 字';
  }
}

npEdit.addEventListener('input', () => {
  const n = byId(state.selId);
  if (!n) return;
  const had = !!(n.Note && n.Note.length);
  n.Note = npEdit.value;
  const has = !!n.Note.length;
  npCount.textContent = n.Note.length + ' 字';
  markDirty();
  pushHistory('note:' + n.NodeID);
  if (had !== has) render(); // 筆記標記出現／消失時重繪節點
});

function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdRender(src){
  const out = [];
  let list = null;
  const closeList = () => { if (list){ out.push('</' + list + '>'); list = null; } };
  for (const line of String(src || '').split('\n')){
    let m;
    if (/^\s*$/.test(line)){ closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))){
      closeList(); const l = m[1].length;
      out.push('<h' + l + '>' + mdInline(m[2]) + '</h' + l + '>'); continue;
    }
    if (/^-{3,}\s*$/.test(line)){ closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^>\s?(.*)/))){ closeList(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); continue; }
    if ((m = line.match(/^[-*]\s+(.*)/))){
      if (list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + mdInline(m[1]) + '</li>'); continue;
    }
    if ((m = line.match(/^\d+[.)]\s+(.*)/))){
      if (list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + mdInline(m[1]) + '</li>'); continue;
    }
    closeList(); out.push('<p>' + mdInline(line) + '</p>');
  }
  closeList();
  return out.join('');
}

/* ---------- 儲存與同步 ---------- */
function setStatus(kind, extra){
  const el = $('#saveStatus'), tx = $('#saveStatusText');
  el.className = 'save-status ' + kind;
  tx.textContent =
    kind === 'dirty'  ? '未儲存' :
    kind === 'saving' ? '儲存中…' :
    kind === 'saved'  ? '已儲存 ' + (extra || nowHM()) :
    kind === 'error'  ? '儲存失敗' : '—';
}

function markDirty(){
  if (!state.currentPageId) return;
  state.dirty = true;
  setStatus('dirty');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveCurrentPage(), 1600);
}

function serializeNodes(){
  return state.nodes.map(n => ({
    nodeId: n.NodeID, parentId: n.ParentID || '',
    text: n.Text || '', note: n.Note || '',
    orderIndex: n.OrderIndex || 0,
    x: n.X == null ? '' : n.X, y: n.Y == null ? '' : n.Y,
    color: n.Color || ''
  }));
}

async function saveCurrentPage(force){
  clearTimeout(saveTimer);
  if (!state.currentPageId) return;
  if (!state.dirty && !force) return;
  if (state.saving){ state.saveAgain = true; return; }
  state.saving = true;
  const pageId = state.currentPageId;
  const payload = serializeNodes();
  state.dirty = false;
  setStatus('saving');
  try {
    await api('savePage', { pageId: pageId, nodes: payload });
    if (!state.dirty) setStatus('saved');
  } catch (e){
    state.dirty = true;
    setStatus('error');
    toast('儲存失敗：' + e.message, 'error');
  } finally {
    state.saving = false;
    if (state.saveAgain){ state.saveAgain = false; if (state.dirty) saveCurrentPage(); }
  }
}

async function flushSave(){
  clearTimeout(saveTimer);
  if (state.dirty) await saveCurrentPage(true);
  let guard = 0;
  while (state.saving && guard++ < 120) await sleep(80);
}

$('#btnSave').onclick = () => {
  if (!state.currentPageId){ toast('尚未開啟任何頁面'); return; }
  saveCurrentPage(true);
};

window.addEventListener('beforeunload', e => {
  if (state.dirty){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('pagehide', () => {
  if (state.dirty && state.currentPageId && apiUrl()){
    try {
      navigator.sendBeacon(apiUrl(), new Blob(
        [JSON.stringify({ action: 'savePage', pageId: state.currentPageId, nodes: serializeNodes() })],
        { type: 'text/plain;charset=utf-8' }));
      state.dirty = false;
    } catch (_){}
  }
});

/* ---------- 頁籤列 ---------- */
const tabsEl = $('#tabs');

function renderTabs(){
  tabsEl.innerHTML = '';
  state.pages.forEach(pg => {
    const t = document.createElement('div');
    t.className = 'tab' + (pg.pageId === state.currentPageId ? ' active' : '');
    t.draggable = true;
    t.dataset.pid = pg.pageId;
    const s = document.createElement('span');
    s.textContent = pg.title;
    t.appendChild(s);
    t.addEventListener('click', () => { if (pg.pageId !== state.currentPageId) openPage(pg.pageId); });
    t.addEventListener('dblclick', () => renameTabInline(t, pg));
    t.addEventListener('contextmenu', e => {
      e.preventDefault();
      showMenu(e.clientX, e.clientY, [
        { label: '重新命名頁籤', fn: () => renameTabInline(t, pg) },
        { label: '刪除頁籤', danger: true, fn: () => deletePageAsk(pg) }
      ]);
    });
    t.addEventListener('dragstart', e => {
      t.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', pg.pageId); } catch (_){}
    });
    t.addEventListener('dragend', () => { t.classList.remove('dragging'); commitTabOrder(); });
    tabsEl.appendChild(t);
  });
  $('#btnAddPage').hidden = !state.currentMapId;
}

tabsEl.addEventListener('dragover', e => {
  e.preventDefault();
  const dragging = tabsEl.querySelector('.tab.dragging');
  if (!dragging) return;
  const after = [...tabsEl.querySelectorAll('.tab:not(.dragging)')].find(el => {
    const r = el.getBoundingClientRect();
    return e.clientX < r.left + r.width / 2;
  });
  if (after == null) tabsEl.appendChild(dragging);
  else tabsEl.insertBefore(dragging, after);
});

async function commitTabOrder(){
  const ids = [...tabsEl.querySelectorAll('.tab')].map(el => el.dataset.pid);
  const cur = state.pages.map(p => p.pageId);
  if (ids.join() === cur.join()) return;
  state.pages.sort((a, b) => ids.indexOf(a.pageId) - ids.indexOf(b.pageId));
  renderTabs();
  try { await api('reorderPages', { mapId: state.currentMapId, pageIds: ids }); }
  catch (e){
    toast('頁籤排序儲存失敗：' + e.message, 'error');
    if (state.currentMapId) loadPages(state.currentMapId, state.currentPageId);
  }
}

function renameTabInline(t, pg){
  const span = t.querySelector('span');
  if (!span) return;
  const input = document.createElement('input');
  input.value = pg.title;
  t.replaceChild(input, span);
  input.focus(); input.select();
  let done = false;
  const commit = async () => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (!v || v === pg.title){ renderTabs(); return; }
    const old = pg.title;
    pg.title = v;
    renderTabs();
    try { await api('renamePage', { pageId: pg.pageId, title: v }); }
    catch (e){ pg.title = old; renderTabs(); toast('重新命名失敗：' + e.message, 'error'); }
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') commit();
    if (e.key === 'Escape'){ done = true; renderTabs(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', e => e.stopPropagation());
}

async function deletePageAsk(pg){
  if (state.pages.length <= 1){ toast('僅剩一個頁籤，無法刪除'); return; }
  const ok = await confirmDlg('刪除頁籤', '「' + pg.title + '」與其所有節點將一併刪除，無法復原。', '刪除');
  if (!ok) return;
  try {
    if (pg.pageId === state.currentPageId){ clearTimeout(saveTimer); state.dirty = false; }
    await api('deletePage', { pageId: pg.pageId });
    const wasCurrent = pg.pageId === state.currentPageId;
    state.pages = state.pages.filter(p => p.pageId !== pg.pageId);
    renderTabs();
    toast('已刪除頁籤「' + pg.title + '」');
    if (wasCurrent && state.pages.length) openPage(state.pages[0].pageId);
  } catch (e){ toast('刪除失敗：' + e.message, 'error'); }
}

$('#btnAddPage').onclick = async () => {
  if (!state.currentMapId) return;
  try {
    const r = await api('createPage', { mapId: state.currentMapId, title: '頁面' + (state.pages.length + 1) });
    await loadPages(state.currentMapId, r.pageId);
  } catch (e){ toast('新增頁籤失敗：' + e.message, 'error'); }
};

/* ---------- 頁面載入 ---------- */
async function openPage(pageId){
  await flushSave();
  state.currentPageId = pageId;
  localStorage.setItem(LS_LAST_PAGE, pageId);
  renderTabs();
  state.nodes = [];
  state.selId = null;
  state.collapsed = new Set();
  edgesG.innerHTML = ''; nodesG.innerHTML = '';
  showHint('載入頁面中……');
  try {
    const r = await api('getPage', { pageId: pageId });
    if (state.currentPageId !== pageId) return; // 載入期間已切換到別頁
    state.nodes = r.nodes.map(n => ({
      NodeID: n.nodeId, ParentID: n.parentId || '',
      Text: n.text || '', Note: n.note || '',
      OrderIndex: n.orderIndex || 0,
      X: (n.x == null ? null : Number(n.x)),
      Y: (n.y == null ? null : Number(n.y)),
      Color: n.color || ''
    }));
    state.dirty = false;
    setStatus('idle');
    ensureRoot(); // 空頁面自動補中心主題（會標記待儲存）
    const root = childrenOf('')[0];
    state.selId = root ? root.NodeID : null;
    initHistory();
    hideHint();
    setCanvasUI(true);
    render();
    fitView();
    refreshNotePanel();
  } catch (e){
    if (state.currentPageId !== pageId) return;
    showHint('頁面載入失敗\n' + e.message);
    toast('載入失敗：' + e.message, 'error');
  }
}

async function loadPages(mapId, preferPageId){
  const r = await api('listPages', { mapId: mapId });
  if (state.currentMapId !== mapId) return;
  state.pages = r.pages;
  renderTabs();
  let pid = preferPageId || localStorage.getItem(LS_LAST_PAGE);
  if (!state.pages.find(p => p.pageId === pid)) pid = state.pages.length ? state.pages[0].pageId : null;
  if (pid) await openPage(pid);
  else { setCanvasUI(false); showHint('此筆記本沒有任何頁籤'); }
}

async function openMap(mapId){
  await flushSave();
  const m = state.maps.find(x => x.mapId === mapId);
  if (!m){ toast('找不到這本筆記本', 'error'); return; }
  state.currentMapId = mapId;
  localStorage.setItem(LS_LAST_MAP, mapId);
  setMapTitle(m.title);
  closeDrawer();
  renderMapList();
  state.currentPageId = null;
  state.pages = [];
  renderTabs();
  setCanvasUI(false);
  edgesG.innerHTML = ''; nodesG.innerHTML = '';
  showHint('載入頁籤中……');
  try { await loadPages(mapId); }
  catch (e){
    showHint('頁籤載入失敗\n' + e.message);
    toast('載入失敗：' + e.message, 'error');
  }
}

function renderMapList(){
  const list = $('#mapList');
  if (!state.maps.length){
    list.innerHTML = '<div class="dw-empty">尚無筆記本<br>點右上「＋」建立第一本</div>';
    return;
  }
  list.innerHTML = '';
  state.maps.forEach(m => {
    const it = document.createElement('div');
    it.className = 'map-item' + (m.mapId === state.currentMapId ? ' active' : '');
    it.innerHTML =
      '<div class="mi-title">' + esc(m.title) + '</div>' +
      '<div class="mi-time">' + esc(relTime(m.updatedAt)) + '</div>' +
      '<button class="mi-more" title="更多" aria-label="更多動作">⋯</button>';
    it.addEventListener('click', e => {
      if (e.target.closest('.mi-more')) return;
      openMap(m.mapId);
    });
    const menu = ev => {
      ev.preventDefault(); ev.stopPropagation();
      showMenu(ev.clientX, ev.clientY, [
        { label: '重新命名', fn: () => renameMapAsk(m) },
        { label: '刪除筆記本', danger: true, fn: () => deleteMapAsk(m) }
      ]);
    };
    it.querySelector('.mi-more').addEventListener('click', menu);
    it.addEventListener('contextmenu', menu);
    list.appendChild(it);
  });
}

async function renameMapAsk(m){
  const v = await promptDlg('重新命名筆記本', m.title);
  if (!v || v === m.title) return;
  const old = m.title;
  m.title = v;
  renderMapList();
  if (m.mapId === state.currentMapId) setMapTitle(v);
  try { await api('renameMap', { mapId: m.mapId, title: v }); }
  catch (e){
    m.title = old;
    renderMapList();
    if (m.mapId === state.currentMapId) setMapTitle(old);
    toast('重新命名失敗：' + e.message, 'error');
  }
}

async function deleteMapAsk(m){
  const ok = await confirmDlg('刪除筆記本', '「' + m.title + '」與其所有頁籤、節點將一併刪除，無法復原。', '刪除');
  if (!ok) return;
  try {
    if (m.mapId === state.currentMapId){ clearTimeout(saveTimer); state.dirty = false; }
    await api('deleteMap', { mapId: m.mapId });
    state.maps = state.maps.filter(x => x.mapId !== m.mapId);
    if (m.mapId === state.currentMapId) resetWorkspace();
    renderMapList();
    toast('已刪除「' + m.title + '」');
  } catch (e){ toast('刪除失敗：' + e.message, 'error'); }
}

$('#btnNewMap').onclick = async () => {
  const v = await promptDlg('新增筆記本', '', '輸入筆記本標題');
  if (!v) return;
  try {
    const r = await api('createMap', { title: v });
    await loadMaps();
    openMap(r.mapId);
  } catch (e){ toast('新增失敗：' + e.message, 'error'); }
};

async function loadMaps(){
  const list = $('#mapList');
  list.innerHTML = '<div class="dw-empty">載入中……</div>';
  try {
    const r = await api('listMaps');
    state.maps = r.maps;
    renderMapList();
    return true;
  } catch (e){
    list.innerHTML = '<div class="dw-empty">清單載入失敗<br>' + esc(e.message) + '</div>';
    toast('無法載入筆記本清單：' + e.message, 'error');
    return false;
  }
}

function resetWorkspace(){
  state.currentMapId = null;
  state.currentPageId = null;
  state.pages = [];
  state.nodes = [];
  state.selId = null;
  setMapTitle(null);
  renderTabs();
  edgesG.innerHTML = ''; nodesG.innerHTML = '';
  setCanvasUI(false);
  setStatus('idle');
  hist = []; histIdx = -1; updateUndoUI();
  closeNotePanel();
  showHint('從左上角開啟筆記本清單\n選擇或建立一本筆記本');
}

/* ---------- 連線設定 ---------- */
function openSettings(firstRun){
  return new Promise(resolve => {
    modalResolve = resolve;
    const box = openModal(
      '<h3>連線設定</h3>' +
      '<p>本工具將資料儲存在你自己的 Google 試算表，透過 Apps Script 讀寫，跨裝置同步。</p>' +
      '<label>Apps Script 部署網址（結尾為 /exec）</label>' +
      '<input type="url" id="setUrl" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(apiUrl()) + '">' +
      '<details' + (firstRun ? ' open' : '') + '>' +
      '<summary>部署步驟</summary>' +
      '<ol>' +
      '<li>建立一份新的 Google 試算表</li>' +
      '<li>「擴充功能」→「Apps Script」，貼上 Code.gs 全部內容並儲存</li>' +
      '<li>「部署」→「新增部署」→ 類型「網頁應用程式」</li>' +
      '<li>執行身分「我」；具有存取權的使用者「任何人」</li>' +
      '<li>複製部署網址貼到上方欄位（Maps／Pages／Nodes 工作表會自動建立，不需手動建表）</li>' +
      '</ol>' +
      '<div class="hint">日後更新 Code.gs 後，需「管理部署」→ 編輯 → 版本選「新版本」再部署，程式才會生效（網址不變）。</div>' +
      '</details>' +
      '<div class="m-foot">' +
      (firstRun ? '' : '<button class="btn" id="mCancel">取消</button>') +
      '<button class="btn primary" id="mOk">測試並儲存</button></div>');
    const input = box.querySelector('#setUrl');
    input.focus();
    const cancel = box.querySelector('#mCancel');
    if (cancel) cancel.onclick = () => closeModal(false);
    const okBtn = box.querySelector('#mOk');
    okBtn.onclick = async () => {
      const v = input.value.trim();
      if (!v){ input.focus(); return; }
      okBtn.disabled = true;
      okBtn.textContent = '測試中……';
      const prev = apiUrl();
      localStorage.setItem(LS_API, v);
      try {
        await api('ping');
        toast('連線成功');
        closeModal(true);
      } catch (e){
        localStorage.setItem(LS_API, prev);
        okBtn.disabled = false;
        okBtn.textContent = '測試並儲存';
        toast('連線測試失敗：' + e.message, 'error');
      }
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') okBtn.onclick(); });
  });
}

$('#btnSettings').onclick = async () => {
  const changed = await openSettings(false);
  if (changed){
    resetWorkspace();
    if (await loadMaps()) openDrawer();
  }
};

/* ---------- 啟動 ---------- */
async function init(){
  setStatus('idle');
  resetWorkspace();
  if (!apiUrl()){
    showHint('首次使用\n請先完成連線設定（貼上 Apps Script 部署網址）');
    while (!apiUrl()){
      await openSettings(true);
      if (!apiUrl()) await sleep(300);
    }
  }
  const ok = await loadMaps();
  const last = localStorage.getItem(LS_LAST_MAP);
  if (ok && last && state.maps.find(m => m.mapId === last)) openMap(last);
  else openDrawer();
}
init();
</script>
